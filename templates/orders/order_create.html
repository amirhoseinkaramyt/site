{% extends "base.html" %}
{% block content %}
<h2>Create New Order</h2>
<p>Are you sure you want to start a new order?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Yes, Create Order</button>
    <a href="{% url 'order_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
